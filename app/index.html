<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Show Tracker</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1a1d25">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Show Tracker">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <button type="button" class="brand" id="home" title="Back to Upcoming">
      <img class="logo" src="icon.svg" alt="" width="30" height="30">
      <span class="name">Show Tracker</span>
    </button>
    <form class="search" id="search-form" role="search" autocomplete="off">
      <select id="search-source" aria-label="What to search">
        <option value="anime">Anime</option>
        <option value="tv">TV</option>
      </select>
      <input id="search-input" type="search" placeholder="Add a show… type a title" aria-label="Search for a show to add">
      <div class="results" id="search-results" hidden></div>
    </form>
    <div class="top-actions">
      <span class="muted small" id="refresh-status"></span>
      <button type="button" class="btn" id="refresh-btn">Refresh</button>
      <div class="menu-wrap">
        <button type="button" class="avatar" id="profile-btn" aria-label="Account menu" aria-haspopup="menu" aria-expanded="false">?</button>
        <div class="menu" id="profile-menu" role="menu" hidden>
          <div class="menu-who muted small" id="menu-who"></div>
          <button type="button" role="menuitem" data-go="profile">Profile</button>
          <button type="button" role="menuitem" data-go="settings">Settings</button>
          <button type="button" role="menuitem" data-go="logout">Log out</button>
        </div>
      </div>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Views"></nav>
  <div class="banner" id="banner" hidden></div>
  <main id="view"></main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
